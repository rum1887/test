name: CI - Runtime Trust Layer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite (Unit, Integration, E2E)
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: |
          pytest tests/ -v

      - name: Run Deployment Smoke Test
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: |
          python scripts/smoke_test.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Dashboard
        run: |
          cd apps/web
          npm ci || npm install
          npm run build
