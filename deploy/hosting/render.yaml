services:
  # Backend API on Render Free Tier
  - type: web
    name: runtime-trust-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FALKORDB_HOST
        value: falkordb.example.internal
      - key: FALKORDB_PORT
        value: "6379"
      - key: RUNTIME_MODE
        value: replay_synthetic
    healthCheckPath: /api/ready
