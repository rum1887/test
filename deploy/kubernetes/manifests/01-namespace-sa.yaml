apiVersion: v1
kind: Namespace
metadata:
  name: trust-lab
  labels:
    security.runtime-trust.io/monitored: "true"
    environment: "isolated-synthetic-lab"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limited-sa
  namespace: trust-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-sa
  namespace: trust-lab
  annotations:
    security.warning: "Deliberately overprivileged demonstration service account"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxy-sa
  namespace: trust-lab
