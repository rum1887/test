# Limited Role for regular workloads
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: limited-role
  namespace: trust-lab
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limited-binding
  namespace: trust-lab
subjects:
  - kind: ServiceAccount
    name: limited-sa
    namespace: trust-lab
roleRef:
  kind: Role
  name: limited-role
  apiGroup: rbac.authorization.k8s.io
---
# Deliberately Overprivileged Role for checkout-sa (Vulnerability Demo)
# Security flaw: Service account granted secrets:get and configmaps:* across namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: overprivileged-secrets-reader
  namespace: trust-lab
  annotations:
    security.cve: "SYNTHETIC-MISCONFIG-01"
    security.explanation: "Workload granted read permissions to all cluster secrets instead of dedicated vault tokens"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: overprivileged-checkout-binding
  namespace: trust-lab
subjects:
  - kind: ServiceAccount
    name: checkout-sa
    namespace: trust-lab
roleRef:
  kind: Role
  name: overprivileged-secrets-reader
  apiGroup: rbac.authorization.k8s.io
