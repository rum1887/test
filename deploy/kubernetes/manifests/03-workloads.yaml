apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: trust-lab
  labels:
    app: checkout-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
        tier: backend
    spec:
      serviceAccountName: checkout-sa
      containers:
        - name: checkout-app
          image: busybox:latest
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "20m"
              memory: "32Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
  namespace: trust-lab
  labels:
    app: frontend-proxy
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-proxy
  template:
    metadata:
      labels:
        app: frontend-proxy
        tier: frontend
    spec:
      serviceAccountName: proxy-sa
      containers:
        - name: proxy-app
          image: busybox:latest
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web
  namespace: trust-lab
  labels:
    app: public-web
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: public-web
  template:
    metadata:
      labels:
        app: public-web
        tier: frontend
    spec:
      serviceAccountName: limited-sa
      containers:
        - name: web-app
          image: busybox:latest
          command: ["sh", "-c", "while true; do sleep 3600; done"]
