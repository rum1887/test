apiVersion: v1
kind: Secret
metadata:
  name: customer-vault-secrets
  namespace: trust-lab
  labels:
    security.sensitivity: "CRITICAL"
    compliance: "PCI-DSS"
type: Opaque
stringData:
  VAULT_TOKEN: "synthetic-token-not-a-real-secret-123456"
  ENCRYPTION_KEY: "synthetic-key-aes-256-gcm-00000000000000"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-records-db
  namespace: trust-lab
  labels:
    security.sensitivity: "CRITICAL"
    compliance: "PCI-DSS"
type: Opaque
stringData:
  DB_URL: "postgres://synthetic_user:synthetic_pass@postgres.internal:5432/payments"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-iam-secrets
  namespace: trust-lab
  labels:
    security.sensitivity: "CRITICAL"
    compliance: "SOC2"
type: Opaque
stringData:
  AWS_SECRET_ACCESS_KEY: "synthetic-iam-key-not-real-credentials-xyz"
