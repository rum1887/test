# Baseline Network Policy: Restrict egress to internal cluster services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-egress-rules
  namespace: trust-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              tier: backend
---
# Containment Network Policy (Applied dynamically during containment actions)
# Completely isolates the compromised pod from both ingress and egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quarantine-checkout-isolate
  namespace: trust-lab
  labels:
    security.runtime-trust.io/containment: "active"
spec:
  podSelector:
    matchLabels:
      app: checkout-service
  policyTypes:
    - Ingress
    - Egress
  # Empty ingress and egress blocks all traffic
