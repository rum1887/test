apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: monitor-production-shells-and-credentials
  namespace: kube-system
spec:
  kprobes:
    # 1. Trace execve syscalls for interactive shells and network binaries
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/bin/sh"
                - "/bin/bash"
                - "/usr/bin/curl"
                - "/usr/bin/wget"
                - "/usr/bin/nc"
          matchNamespaces:
            - "trust-lab"
          matchActions:
            - action: Sigkill
            - action: Post
    # 2. Trace access to Kubernetes service account tokens
    - call: "sys_openat"
      syscall: true
      args:
        - index: 1
          type: "string"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/var/run/secrets/kubernetes.io/serviceaccount"
          matchNamespaces:
            - "trust-lab"
          matchActions:
            - action: Post
