id: pair2_role_binding_benign
pair_id: pair2_role_binding
variant: benign
title: "Scheduled Analytics Migration RoleBinding"
description: "A temporary 48-hour secrets:get permission is granted to analytics-worker via reviewed PR and authorized Jira ticket by Alice."
inject: false

mutations:
  - action: create_node
    label: Document
    id: doc-ticket-migration-201
    properties:
      kind: ticket
      trust: trusted
      title: "DATA-409: Analytics DB Migration Pipeline"
      body: "Grant temporary secrets:get access to analytics-worker for 48 hours to read legacy DB credentials. Approved by SRE lead."
  - action: create_node
    label: Document
    id: pr-analytics-migration-44
    properties:
      kind: pr
      trust: trusted
      title: "PR #44: Add temporary secret reader role binding for analytics migration"
      body: "LGTM. Verified TTL expiration is configured for 48 hours."
  - action: create_node
    label: ChangeSet
    id: change-rb-tf-201
    properties:
      kind: terraform_apply
      summary: "Apply terraform plan granting temporary secrets:get to sa-analytics"
      author_id: user-alice
      ticket_id: doc-ticket-migration-201
      pr_id: pr-analytics-migration-44
  - action: create_node
    label: Permission
    id: perm-secrets-get
    properties:
      verb: get
      resource: secrets
      scope: data
  - action: create_edge
    from_id: change-rb-tf-201
    to_id: workload-analytics
    rel_type: TOUCHED
    provenance: configured
    source: terraform-ci
  - action: create_edge
    from_id: sa-analytics
    to_id: perm-secrets-get
    rel_type: HAS_PERMISSION
    valid_from: 1700000000
    valid_to: 1700172800
    provenance: configured
    source: terraform-ci
  - action: create_edge
    from_id: doc-ticket-migration-201
    to_id: workload-analytics
    rel_type: ABOUT
    provenance: configured
    source: jira

telemetry: []

alert:
  id: alert-pair2-role-binding
  title: "New privileged RoleBinding grants secrets:get access to analytics-worker"
  kind: privilege_escalation
  severity: high
  status: new
  target_id: workload-analytics
  target_label: Workload
  at_offset: 10
  details:
    workload: "analytics-worker"
    permission: "perm-secrets-get"
    service_account: "sa-analytics"

ground_truth:
  verdict: benign
  rationale: "Temporary RoleBinding granted via approved PR pr-analytics-migration-44 and ticket doc-ticket-migration-201 by active engineer Alice with 48h TTL."
  required_evidence:
    - change-rb-tf-201
    - doc-ticket-migration-201
    - user-alice
  correct_actions:
    - dismiss_alert
